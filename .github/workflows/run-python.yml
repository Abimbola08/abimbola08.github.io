name: Run Python generators

# Runs on every push to the site branch, and can also be started by hand
# from the Actions tab on GitHub.
on:
  push:
    branches: [master, main]
  workflow_dispatch:

# Needed so the workflow can commit the generated files back to the repo.
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas geopy getorg

      - name: Generate publication pages from publications.tsv
        working-directory: markdown_generator
        run: python publications.py

      - name: Generate talk pages from talks.tsv
        working-directory: markdown_generator
        run: python talks.py

      - name: Build the talk map
        working-directory: _talks
        # Geocoding relies on a free external service; don't fail the whole
        # run if it is unavailable.
        continue-on-error: true
        run: python ../talkmap.py

      - name: Commit generated files back to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "chore: regenerate pages and talk map [skip ci]"
            git push
          fi
