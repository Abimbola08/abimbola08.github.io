    Experience:
      - company: Gresham Smith — GDOT Traffic Forecasting
        position: Traffic Engineer
        location: Atlanta, GA
        start_date: 2024-11-01
        end_date: present
        highlights:
          - Review traffic forecasting reports on behalf of the Georgia Department of Transportation Office of Planning and Budgeting.
          - Conduct traffic impact analyses for proposed developments and perform roundabout, intersection, and interchange analysis in SIDRA.
          - Analyze crash, volume, and roadway data to identify high-risk locations and prioritize safety countermeasures; present spatial crash trends using GIS and Tableau.
          - Prepare technical reports and presentations for clients and public agencies.

      - company: Gresham Smith — GDOT SigOps
        position: Traffic Signal & Operations Engineer
        location: Atlanta, GA
        start_date: 2023-05-01
        end_date: 2024-10-31
        highlights:
          - Configured, monitored, and retimed signal controllers using Q-Free MaxTime and MaxView to improve arterial flow and reduce delay.
          - Extracted and interpreted Automated Traffic Signal Performance Measures (ATSPM) to inform signal timing strategies; built Power BI/DAX dashboards for performance monitoring.
          - Simulated signal timing alternatives in VISSIM and TransModeler to quantify impacts on flow, safety, and efficiency.
          - Developed automation scripts for data extraction and analysis, substantially reducing manual effort; contributed to technical proposals and business development.

      - company: University of North Carolina at Charlotte — IDEAS Center
        position: Graduate Research Assistant
        location: Charlotte, NC
        start_date: 2021-08-01
        end_date: 2023-05-31
        highlights:
          - Developed a statewide weather-related crash risk workflow for North Carolina using space-time cubes (5-mi grid, monthly aggregation) and EPDO risk scores, with machine learning models to identify, predict, and interpret high-risk locations.
          - Designed synthetic data generation techniques (SMOTE-N, ADASYN-N extensions) for nominal crash predictors and benchmarked random forest and XGBoost crash severity models; published in Transportation Research Record.
          - Compared deep learning, machine learning, and statistical models for weather-related crash severity prediction under a Mineta Transportation Institute–funded project (MTI 2320); co-authored the final report.
          - Modeled the effect of mountainous terrain on weather-related crash rates using Tobit, latent class Tobit, and two-part truncated log-normal models.
          - Identified connected and automated vehicle (CAV) data needs of North Carolina public agencies and developed a data readiness framework for NCDOT.
          - Built and calibrated VISSIM microsimulation models of the Charlotte Douglas International Airport road network; evaluated unconventional intersection designs (CFI, RCUT, mini roundabouts) on travel time reliability (MTI 2120).
          - Estimated fixed- and random-parameter ordered logit models of non-motorists' safety perception of autonomous vehicles.

      - company: Volvo Group — IT
        position: Data Analyst Intern
        location: New River Valley, VA
        start_date: 2021-01-01
        end_date: 2021-05-31
        highlights:
          - Automated data extraction and preprocessing in R; conducted exploratory analysis and built KPI dashboards for production monitoring.
          - Assisted in designing and testing predictive maintenance and anomaly detection models for production line equipment.

      - company: Federal Ministry of Works — Department of Highways
        position: Transportation Engineer I
        location: Kwara, Nigeria
        start_date: 2017-04-01
        end_date: 2019-07-31
        highlights:
          - Conducted traffic signal warrant analyses and developed signal timing plans from field traffic data; supported signal upgrade implementation and post-installation evaluation.
          - Prepared traffic engineering reports covering traffic counts, speed studies, and level-of-service analysis; managed technical proposals with a cumulative value exceeding $200,000.
          - Coordinated with municipal and state agencies to ensure compliance with local traffic engineering standards.

